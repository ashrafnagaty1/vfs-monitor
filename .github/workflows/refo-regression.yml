name: ReFo Regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reference-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q .
      - name: Reference integration self-test
        run: python v11_reference_selftest.py
      - name: Check Cloudflare JavaScript syntax
        run: |
          node --check cloudflare/composite_worker.js
          node --check src/sector_enhanced.js
          node --check src/tradingview_core_wrapper.js
