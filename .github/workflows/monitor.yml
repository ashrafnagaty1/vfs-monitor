name: EGX Smart Scanner

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: egx-smart-scanner
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Validate Python modules
        run: python -m py_compile telegram_bot.py always_on_bot.py monitor.py pro_engine.py trade_lifecycle.py data_provider.py data_health.py self_test.py

      - name: Run deterministic self tests
        run: |
          python self_test.py
          python -c "from trade_lifecycle import self_test; self_test(); print('trade lifecycle self-test: PASS')"

      - name: Check market data health
        continue-on-error: true
        env:
          EGX_LIVE_QUOTE_URL_TEMPLATE: ${{ secrets.EGX_LIVE_QUOTE_URL_TEMPLATE }}
          EGX_LIVE_TOKEN: ${{ secrets.EGX_LIVE_TOKEN }}
          EGX_LIVE_AUTH_HEADER: ${{ secrets.EGX_LIVE_AUTH_HEADER }}
          EGX_LIVE_AUTH_PREFIX: ${{ secrets.EGX_LIVE_AUTH_PREFIX }}
        run: python data_health.py

      - name: Run fast Telegram interface
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python telegram_bot.py

      - name: Run professional signal engine
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          EGX_LIVE_QUOTE_URL_TEMPLATE: ${{ secrets.EGX_LIVE_QUOTE_URL_TEMPLATE }}
          EGX_LIVE_TOKEN: ${{ secrets.EGX_LIVE_TOKEN }}
          EGX_LIVE_AUTH_HEADER: ${{ secrets.EGX_LIVE_AUTH_HEADER }}
          EGX_LIVE_AUTH_PREFIX: ${{ secrets.EGX_LIVE_AUTH_PREFIX }}
        run: python pro_engine.py

      - name: Build WATCH ENTRY lifecycle
        run: python trade_lifecycle.py

      - name: Save bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/egx-state
          for f in state.json alarms.json data_health.json; do
            [ -f "$f" ] && cp "$f" "/tmp/egx-state/$f"
          done

          git fetch origin main
          git reset --hard origin/main

          for f in state.json alarms.json data_health.json; do
            [ -f "/tmp/egx-state/$f" ] && cp "/tmp/egx-state/$f" "$f"
          done

          git add state.json alarms.json data_health.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to save"
            exit 0
          fi

          git commit -m "Update EGX bot state"
          git push origin HEAD:main
