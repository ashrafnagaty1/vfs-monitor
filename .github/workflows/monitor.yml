name: EGX Smart Scanner

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: egx-smart-scanner
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install requests
        run: pip install requests

      - name: Validate Python modules
        run: python -m py_compile telegram_bot.py bot_experience.py always_on_bot.py monitor.py pro_engine.py pro_engine_v2.py trade_lifecycle.py signal_guard.py portfolio_engine.py data_provider.py data_health.py egxpilot_provider.py self_test.py

      - name: Validate dashboard JavaScript
        run: |
          for f in src/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Run deterministic self tests
        run: |
          python self_test.py
          python -c "from trade_lifecycle import self_test; self_test(); print('trade lifecycle self-test: PASS')"
          python -c "from signal_guard import self_test; self_test(); print('signal guard self-test: PASS')"
          python -c "from portfolio_engine import self_test; self_test(); print('portfolio engine self-test: PASS')"
          python -c "import telegram_bot, bot_experience; bot_experience.apply(telegram_bot); assert telegram_bot.MAIN_MENU['keyboard'][0][0] == '📊 الشاشة اللحظية'; assert abs(bot_experience._rr(10, 9, 12)-2.0) < 1e-9; assert bot_experience._plan_status({'price':11,'res20':10,'quote_live':False})[0] == 'WATCH'; assert bot_experience._plan_status({'price':10,'res20':10,'quote_live':True})[0] == 'ENTRY'; print('bot experience self-test: PASS')"

      - name: Check market data health
        continue-on-error: true
        env:
          EGX_LIVE_QUOTE_URL_TEMPLATE: ${{ secrets.EGX_LIVE_QUOTE_URL_TEMPLATE }}
          EGX_LIVE_TOKEN: ${{ secrets.EGX_LIVE_TOKEN }}
          EGX_LIVE_AUTH_HEADER: ${{ secrets.EGX_LIVE_AUTH_HEADER }}
          EGX_LIVE_AUTH_PREFIX: ${{ secrets.EGX_LIVE_AUTH_PREFIX }}
        run: python data_health.py

      - name: Run enriched professional signal engine
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          EGX_LIVE_QUOTE_URL_TEMPLATE: ${{ secrets.EGX_LIVE_QUOTE_URL_TEMPLATE }}
          EGX_LIVE_TOKEN: ${{ secrets.EGX_LIVE_TOKEN }}
          EGX_LIVE_AUTH_HEADER: ${{ secrets.EGX_LIVE_AUTH_HEADER }}
          EGX_LIVE_AUTH_PREFIX: ${{ secrets.EGX_LIVE_AUTH_PREFIX }}
        run: python pro_engine_v2.py

      - name: Build WATCH ENTRY lifecycle
        run: python trade_lifecycle.py

      - name: Apply signal safety guard
        run: python signal_guard.py

      - name: Update signal portfolio and performance
        run: python portfolio_engine.py

      - name: Sync state to Cloudflare Worker
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          test -n "$SYNC_SECRET" || { echo "SYNC_SECRET missing"; exit 1; }
          test -f state.json || { echo "state.json missing"; exit 1; }
          curl --fail-with-body --show-error \
            -X POST "https://vfs-monitor.folkhero3.workers.dev/sync" \
            -H "Authorization: Bearer $SYNC_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @state.json

      - name: Save bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/egx-state
          for f in state.json alarms.json data_health.json; do
            [ -f "$f" ] && cp "$f" "/tmp/egx-state/$f"
          done
          git fetch origin main
          git reset --hard origin/main
          for f in state.json alarms.json data_health.json; do
            [ -f "/tmp/egx-state/$f" ] && cp "/tmp/egx-state/$f" "$f"
          done
          git add state.json alarms.json data_health.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to save"
            exit 0
          fi
          git commit -m "Update EGX bot state"
          git push origin HEAD:main
