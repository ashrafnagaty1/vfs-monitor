services:
  - type: web
    name: refo-egx-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 webhook_server:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: REFO_WEBAPP_URL
        value: https://refogx-pro.folkhero3.workers.dev/
